<div class="grid grid-cols-1 md:grid-cols-2 h-screen bg-white text-gray-800">
  <!-- Hero Section -->
  <div
  class="relative bg-orange-100 overflow-hidden flex items-center justify-center
         basis-[30%] md:h-auto md:min-h-screen"
>
    <!-- Gradasi radial -->
    <div class="absolute inset-0">
      <div
        class="w-[180%] h-[180%] bg-orange-300 rounded-full blur-3xl opacity-60
               -translate-x-1/4 -translate-y-1/3"
      ></div>
    </div>

    <!-- Konten -->
    <div class="z-10 text-center px-4 py-6 md:p-10 max-w-[80%] mx-auto">
      <img src="./logowms.png" alt="Logo" class="mx-auto w-16 md:w-24 mb-4 md:mb-6" />
      <h1 class="text-xl md:text-4xl font-bold text-orange-900 drop-shadow-md leading-tight">
        Warehouse Management System
      </h1>
    </div>
  </div>

  <!-- Form Section -->
  <div
  class="flex items-start md:items-center justify-center px-6 py-2 md:py-16 bg-white
         basis-[70%]"
>
    <div class="w-full max-w-md space-y-6">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Login</h2>

      <div class="flex flex-col gap-4">
        <div>
          <label for="username" class="block mb-1">Username</label>
          <input id="username" type="text" [(ngModel)]="username" pInputText class="w-full" />
        </div>

        <div>
          <label for="password" class="block mb-1">Password</label>
          <!-- <<input id="password" type="password" [(ngModel)]="password" pPassword class="w-full" />> -->
           <p-password [(ngModel)]="password" class="w-full" [inputStyleClass]="w-full" [feedback]="false" [toggleMask]="true" ></p-password>
        </div>

        <button pButton type="button" label="Login" class="w-full" (click)="login()"></button>
      </div>
    </div>
  </div>
</div>
