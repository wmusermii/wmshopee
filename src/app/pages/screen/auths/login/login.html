<div class="min-h-screen flex flex-col lg:flex-row">
  <!-- Hero Section -->
  <div class="lg:w-1/2 flex flex-col items-center justify-center p-2 lg:p-8 text-center lg:text-left"
    style="background-image: radial-gradient(circle at top left, #f97316, #ffffff);">
    <img src="./logowms.png" alt="Warehouse Management System Logo" class="w-32 h-auto mb-2 lg:mb-6" />
    <h1 class="text-3xl font-light text-black">Warehouse Management System</h1>
  </div>
  <!-- Login Form Section -->
  <div class="lg:w-1/2 flex items-center justify-center p-4 lg:p-8 bg-white relative">
    <div class="w-full max-w-md">
      <h2 class="text-2xl font-semibold mb-3 text-gray-800">Sign in to your account</h2>
      <!-- <div [hidden]="!errorMessage.error" class="mb-2">
        <p-message [severity]="errorMessage.severity" [text]="errorMessage.message" [icon]="errorMessage.icon"
          styleClass="p-message p-component block">
        </p-message>
      </div> -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="space-y-2">
        <div class="space-y-3">
          <div class="flex flex-col mb-2">
            <label for="username" class="mb-2">Username</label>
            <input type="text" class="w-full" pInputText formControlName="username" id="username"
              (change)="_changeError()" />
          </div>
          <div class="flex flex-col mb-2">
            <label for="password" class="mb-2">Password</label>
            <p-password formControlName="password" (change)="_changeError()" class="w-full" [feedback]="false"
              styleClass="w-full"
              inputStyleClass="w-full" [toggleMask]="true"></p-password>
          </div>
        </div>
        <button pButton type="submit" class="w-full" [disabled]="!loginForm.valid" style="margin-top: 1.5rem;"
          label="Login"></button>
      </form>
    </div>
  </div>
</div>
