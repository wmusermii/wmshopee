<header class="pt-4 max-w-screen-xl mx-auto px-2 flex items-center justify-between">
  <h1 class="text-xl font-bold mt-2">Arya Nadia</h1>
  <app-datetime></app-datetime>
   <!-- 20 Agustus 2025 -->
</header>
<main class="pt-2 max-w-screen-xl mx-auto px-2 mb-6">
  <div class="w-full flex bg-white py-3 px-5 rounded shadow mb-3 items-center">
      <p class="m-0 px-3">Day : </p><p-datepicker [(ngModel)]="date" [showIcon]="true"> </p-datepicker>
      <p  class="m-0 px-3">From : </p><p-datepicker [(ngModel)]="fromtime" [showIcon]="true"> </p-datepicker>
      <p  class="m-0 px-3">To : </p><p-datepicker [(ngModel)]="totime" [showIcon]="true"> </p-datepicker>
  </div>
</main>
