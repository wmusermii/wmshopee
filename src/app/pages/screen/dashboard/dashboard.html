<header class="pt-4 max-w-screen-xl mx-auto px-2 flex items-start justify-between">
  <!-- <pre>{{userInfo | json }}</pre> -->
  <h1 class="text-xl font-bold m-0 p-0">{{userInfo.fullname}} ({{userInfo.groupname}})</h1>
  <app-datetime></app-datetime>
</header>
<main class="pt-2 max-w-screen-xl mx-auto px-2 mb-6">
      <div class="w-full pt-2 flex items-center gap-2 flex-wrap px-2 mb-6">
          <p-chip [label]="skutotal" icon="pi pi-objects-column" class="border border-solid border-gray-300" styleClass="custom-chip" />
          <p-chip [label]="invoicetotalStr" icon="pi pi-receipt" class="border border-solid border-gray-300" styleClass="custom-chip" />
      </div>
    <div class="w-full flex bg-white py-3 px-5 items-center rounded shadow mb-3">
      <h3 class="text-xl text-gray-400 font-medium p-0 m-0">Shopee Orders : 00:00:01 - 12:00:01</h3>
      <div class="w-full flex flex-col md:flex-row md:items-center space-y-1 md:space-y-0 md:space-x-2">
        <button pButton type="submit" class="w-full" label="Generate Shopee Invoice"></button>
      </div>
    </div>
</main>
